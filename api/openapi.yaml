openapi: 3.0.3
info:
  description: |-
    Every endpoint accepts its parameters as form fields (POST) or query parameters (GET).

    Authenticate with your API key from https://www.smspool.net/my/settings, either as a bearer token (`Authorization: Bearer <key>`) or as a `key` parameter.
  title: SMSPool API
  version: "1.0"
servers:
- url: https://api.smspool.net
tags:
- description: "Look up countries, services, pools, success rates and your balance."
  name: Information
- name: SMS
- name: Preorders
- description: All endpoints for long-term orders
  name: Rental
- name: Pricing
- name: Carrier
- description: These endpoints can only be reached by business accounts.
  name: Business
- description: "> **eSIMs have moved to [SIMJuno](https://simjuno.com).** Buy new\
    \ data-only eSIMs on SIMJuno. The endpoints below remain for eSIMs bought on SMSPool.\n\
    \nIntroduction to the eSIM API usage. Here's a step-to-step process on how to\
    \ streamline your eSIM purchases:\n\n1. Retrieve the country list from **View\
    \ eSIM countries**\n    \n2. Retrieve the plans per country using the **countryCode**\n\
    \    \n3. Create your first purchase using the **Purchase eSIM**\n    \n4. Retrieve\
    \ the **transactionId** from **Purchase eSIM**\n    \n5. Use the **View eSIM profile**\
    \ endpoint to retrieve the QR code, or the access URL in order to install the\
    \ eSIM or view remaining data."
  name: eSIMs
- description: Please keep in mind that this endpoint is only accessible for users
    that have special permissions to generate and maintain vouchers.
  name: Voucher
paths:
  /request/success_rate:
    post:
      description: |-
        This API endpoint is used to retrieve success per country for SMSPool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/request/success_rate`.

        Please use either the service ID, or the service name as service param.
      operationId: request_success_rate
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/request_success_rate_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - country: 1
                    success_rate: "100"
                    price: "0.80"
                    low_price: "0.24"
                    country_id: 1
                    name: United States
                    short_name: US
                  - country: 2
                    success_rate: "1"
                    price: "0.10"
                    low_price: "0.10"
                    country_id: 2
                    name: United Kingdom
                    short_name: GB
                  - country: 4
                    success_rate: "2"
                    price: "0.10"
                    low_price: "0.10"
                    country_id: 4
                    name: Russia
                    short_name: RU
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: service
                      description: Service name or service ID which can be retrieved
                        at the /service/retrieve_all endpoint
              schema: {}
          description: Error
      security: []
      summary: Retrieve country success rates per service
      tags:
      - Information
  /request/balance:
    post:
      description: |-
        This HTTP POST request is used to retrieve the balance for a specific SMSPool. The request is sent to the URL `https://api.smspool.net/request/balance`.

        ### Request Parameters

        This request require the \`key\` param which is your API key

        ### Response

        The response to this request will have a status code of 200 if the request is successful. The response body will be in JSON format and will include a `balance` field. However, the last execution of this request returned an empty string for the `balance` field.

        Please note that the actual value of the `balance` field may vary depending on the user and its configuration.
      operationId: request_balance
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                    balance: "5.00"
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: key
                      description: Your API key which can be found on your settings
                        page at /my/settings
              schema: {}
          description: Error
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: "403"
                  value:
                    success: 0
                    errors:
                    - message: Invalid API key
                      param: key
                      description: Your API key which can be found on your settings
                        page at /my/settings
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Balance
      tags:
      - Information
  /request/suggested_countries:
    post:
      description: |-
        This API endpoint is used to retrieve suggested countries for SMS pool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/request/suggested_countries`.

        Please use either the service ID, or the service name as service param.
      operationId: request_suggested_countries
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/request_suggested_countries_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - pool: 1
                    country_id: 1
                    name: United States
                    short_name: US
                    price: "0.24"
                  - pool: 7
                    country_id: 2
                    name: United Kingdom
                    short_name: GB
                    price: "0.10"
                  - pool: 7
                    country_id: 3
                    name: Netherlands
                    short_name: NL
                    price: "0.24"
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: service
                      description: Service name or service ID which can be retrieved
                        at the /service/retrieve_all endpoint
              schema: {}
          description: Error
      security: []
      summary: Suggested Countries
      tags:
      - Information
  /pool/retrieve_valid:
    post:
      description: |-
        This API endpoint is used to retrieve suggested pools for SMSPool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/pool/retrieve_valid`.

        Please use either the service ID, or the service name as service param.
      operationId: pool_retrieve_valid
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/pool_retrieve_valid_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - pool: 7
                    name: Foxtrot
                    custom_area: 1
                    price: "0.30"
                  - pool: 12
                    name: Mike
                    custom_area: 0
                    price: "0.30"
                  - pool: 4
                    name: Delta
                    custom_area: 0
                    price: "0.32"
                  - pool: 2
                    name: Bravo
                    custom_area: 0
                    price: "1.16"
                  - pool: 3
                    name: Charlie
                    custom_area: 0
                    price: "0.48"
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400":
                  summary: "400"
                  value:
                    success: 0
                    errors:
                    - message: You are missing a required parameter for this request.
                      param: service
                      description: Service name or service ID which can be retrieved
                        at the /service/retrieve_all endpoint
              schema: {}
          description: Error
      security: []
      summary: Suggested Pools
      tags:
      - Information
  /country/retrieve_all:
    get:
      description: This API endpoint is used to retrieve the full country list for
        SMSPool requests. It sends an HTTP GET request to the URL `https://api.smspool.net/country/retrieve_all`.
      operationId: country_retrieve_all
      parameters:
      - explode: true
        in: query
        name: show_all
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - ID: 1
                    name: United States
                    short_name: US
                    region: North America
                  - ID: 53
                    name: Mexico
                    short_name: MX
                    region: North America
                  - ID: 128
                    name: Guadeloupe
                    short_name: GP
                    region: North America
              schema: {}
          description: OK
      security: []
      summary: Country list
      tags:
      - Information
  /service/retrieve_all:
    get:
      description: This API endpoint is used to retrieve the full service list for
        SMSPool requests. It sends an HTTP GET request to the URL `https://api.smspool.net/service/retrieve_all`.
      operationId: service_retrieve_all
      parameters:
      - explode: true
        in: query
        name: country
        required: false
        schema:
          description: Optional parameter to request services per country
          example: "1"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - ID: 1
                    name: "1688"
                    favourite: 0
                  - ID: 2
                    name: 1Q
                    favourite: 0
                  - ID: 3
                    name: 1StopMove
                    favourite: 0
              schema: {}
          description: OK
      security: []
      summary: Service list
      tags:
      - Information
  /pool/retrieve_all:
    post:
      description: This API endpoint is used to retrieve a list of our active pools
        for SMSPool requests. It sends an HTTP POST request to the URL `https://api.smspool.net/pool/retrieve_all`.
      operationId: pool_retrieve_all
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - ID: 0
                    name: Default
                  - ID: 2
                    name: Bravo
                  - ID: 3
                    name: Charlie
              schema: {}
          description: OK
      security: []
      summary: Pool list
      tags:
      - Information
  /purchase/sms:
    post:
      operationId: purchase_sms
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/purchase_sms_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_successful_order":
                  summary: 200 - successful order
                  value:
                    success: 1
                    number: 1234567890
                    cc: "1"
                    phonenumber: "234567890"
                    order_id: ABCDEFGH
                    country: United States
                    service: Service
                    pool: 1
                    expires_in: 1200
                    expiration: 1705309968
                    message: "You have succesfully ordered a Service number from pool:\
                      \ Foxtrot for 0.24."
                    cost: "0.24"
                    cost_in_cents: 24
                "200_-_created_SMS_token":
                  summary: 200 - created SMS token
                  value:
                    success: 1
                    cc: "1"
                    phonenumber: "2334567890"
                    url: https://api.smspool.net/token/smKngIHort75qUBDXH0lKng1Orr4r9e8
                    token: smKngIHort75qUBDXH0lKng1Orr4r9e8
                    message: Your token has been created succesfully!
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
        "422":
          content:
            application/json:
              examples:
                "422_-_OUT_OF_STOCK":
                  summary: 422 - OUT_OF_STOCK
                  value:
                    message: "<p>Pool <b>Foxtrot</b>: <p>We couldn't find an available\
                      \ phone number for you, please try again later!</p></p>"
                    success: 0
                    pools:
                      Foxtrot:
                        success: 0
                        message: "<p><b>Foxtrot</b> <p>We couldn't find an available\
                          \ phone number for you, please try again later!</p></p>"
                        errors:
                        - message: "We couldn't find an available phone number for\
                            \ you, please try again later!"
                        type: OUT_OF_STOCK
                    errors:
                    - message: "We couldn't find an available phone number for you,\
                        \ please try again later!"
                    type: OUT_OF_STOCK
                "422_-_no_price_found_with_min_price":
                  summary: 422 - no price found with min price
                  value:
                    success: 0
                    message: "We could not find a suitable pool below the price of:\
                      \ 0.01"
                    type: PRICE_NOT_FOUND
                "422_-_no_balance":
                  summary: 422 - no balance
                  value:
                    message: "<p>Pool <b>Foxtrot</b>: Insufficient balance, the price\
                      \ is: 0.24 while you only have: 0.00</p>"
                    success: 0
                    pools:
                      Foxtrot:
                        success: 0
                        message: "<p><b>Foxtrot</b> Insufficient balance, the price\
                          \ is: 0.24 while you only have: 0.00</p>"
                        type: BALANCE_ERROR
                    type: BALANCE_ERROR
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Order SMS
      tags:
      - SMS
  /sms/check:
    post:
      description: "You may run into ratelimits while using this endpoint for high\
        \ rate requests, we recommend using /request/active instead as it will list\
        \ all your orders at the same time."
      operationId: sms_check
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/sms_check_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_order_pending":
                  summary: 200 - order pending
                  value:
                    status: 1
                    resend: 0
                    expiration: 1704562249
                    time_left: 1173
                "200_-_order_refunded":
                  summary: 200 - order refunded
                  value:
                    status: 6
                    message: This order has been refunded
                    resend: 0
                    expiration: 1704562249
                    time_left: 1134
                "200_-_order_complete":
                  summary: 200 - order complete
                  value:
                    status: 3
                    sms: "12345"
                    full_sms: "Full code: 12345"
                    expiration: 1704562249
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Check SMS
      tags:
      - SMS
  /request/active:
    post:
      description: "The recommended endpoint to retrieve your current active orders,\
        \ this will display all your orders at the same time. We recommend using this\
        \ endpoint to iterate through your active orders to retrieve your SMS messages."
      operationId: request_active
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - timestamp: 2024-01-06 18:03:15
                    cost: "0.24"
                    order_code: ABCDEFGH
                    phonenumber: "1234567890"
                    code: "0"
                    full_code: ""
                    short_name: US
                    service: Test
                    status: pending
                    expiry: 1704561795
                    time_left: 1126
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Active orders
      tags:
      - SMS
  /sms/cancel:
    post:
      description: |-
        # Cancel your SMS order

        ## Responses

        | **Success** | {"success":1} |
        | **Fail** | {"success":0} |
      operationId: sms_cancel
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/sms_cancel_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_order_cancelled":
                  summary: 200 - order cancelled
                  value:
                    success: 1
                    message: "The order has been cancelled, and you have been refunded\
                      \ 0.24 dollars."
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400_-_order_cannot_be_cancelled_yet":
                  summary: 400 - order cannot be cancelled yet
                  value:
                    success: 0
                    message: "Your order cannot be cancelled yet, please try again\
                      \ later."
              schema: {}
          description: Error
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
        "404":
          content:
            application/json:
              examples:
                "404_-_order_not_found":
                  summary: 404 - order not found
                  value:
                    success: 0
                    message: We could not find this order!
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Cancel SMS
      tags:
      - SMS
  /sms/cancel_all:
    post:
      description: |-
        # Cancel your SMS order

        ## Responses

        | **Success** | {"success":1} |
        | **Fail** | {"success":0} |
      operationId: sms_cancel_all
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                    success: 1
                    message: Your active orders have been refunded
                    refunded_orders: []
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Cancel All SMS
      tags:
      - SMS
  /sms/clear_cache:
    post:
      description: "# Clear your previous SMS cache to allocate previous numbers again\n\
        \n## Responses\n\n| **Success** | {\"success\":1} |  \n| **Fail** | {\"success\"\
        :0} |"
      operationId: sms_clear_cache
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                    success: 1
                    message: Orders cleared successfully.
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Clear SMS Cache
      tags:
      - SMS
  /sms/activate:
    post:
      description: "This endpoint will forcefully activate an SMS to set it available\
        \ for future resends, please keep in mind that these orders are NOT eligible\
        \ for a refund after activating them."
      operationId: sms_activate
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/sms_check_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_activate_SMS":
                  summary: 200 - activate SMS
                  value:
                    success: 1
                    message: "Your order has been activated, you can now use resend\
                      \ on it."
              schema: {}
          description: OK
        "400":
          content:
            application/json:
              examples:
                "400_-_incorrect_pool":
                  summary: 400 - incorrect pool
                  value:
                    success: 0
                    message: "You can only activate orders from pool: 7"
              schema: {}
          description: Error
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
        "404":
          content:
            application/json:
              examples:
                "404_-_order_not_found":
                  summary: 404 - order not found
                  value:
                    success: 0
                    message: We could not find this order!
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Activate SMS
      tags:
      - SMS
  /sms/reactivate:
    post:
      description: "This endpoint will reactivate an order, please keep in mind that\
        \ these orders are NOT eligible for a refund after activating them."
      operationId: sms_reactivate
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/sms_reactivate_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                "200_-_order_reactivated":
                  summary: 200 - order reactivated
                  value:
                    success: 1
                    message: "Your order has been reactivated, please head to your\
                      \ dashboard to view your order!"
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Reactivate SMS
      tags:
      - SMS
  /request/archive:
    post:
      description: "This API endpoint is used to archive a request in the SMS Pool\
        \ system. The HTTP POST request should be sent to `https://api.smspool.net/request/archive`.\n\
        \n### Request Parameters\n\nThe \\`key\\` parameter is required for this endpoint,\
        \ this is your API key.\n\n### Response\n\nThe response for this API endpoint\
        \ will have a status code of 200, indicating a successful request. The response\
        \ body will be in JSON format and will contain the following properties:\n\
        \n- `success` (integer): A flag indicating the success of the request. A value\
        \ of 0 indicates failure.\n- `message` (string): An optional message providing\
        \ additional information about the request. In this case, the message is empty.\n\
        \    \n\nPlease note that the response may contain additional properties not\
        \ mentioned here, but they can be ignored for the purpose of this documentation."
      operationId: request_archive
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                    success: 1
                    message: All your inactive orders have been archived.
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Unknown or revoked API key
      security:
      - bearerAuth: []
      summary: Archive all orders
      tags:
      - SMS
  /sms/unarchive:
    post:
      description: "Move an archived order back to your active orders, so it shows\
        \ up in **Active orders** and on your dashboard again. Use **Archive all orders**\
        \ to archive them."
      operationId: sms_unarchive
      requestBody:
        content:
          application/x-www-form-urlencoded:
