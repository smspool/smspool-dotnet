  /request/history:
    post:
      description: "This API endpoint is used to retrieve the history of SMS requests.\
        \ It is an HTTP POST request that should be made to the following URL: `https://api.smspool.net/request/history`.\n\
        \nThe request requires the \\`key\\` parameter which is your API key.\n\n\
        The response returned by the API is a JSON array. Each element in the array\
        \ represents a historical SMS request and contains the following properties:\n\
        \n- `cost`: The cost of the SMS request.\n- `order_code`: The order code associated\
        \ with the SMS request.\n- `phonenumber`: The phone number to which the SMS\
        \ was sent.\n- `code`: The code associated with the SMS request.\n- `full_code`:\
        \ The full code associated with the SMS request.\n- `short_name`: The short\
        \ name associated with the SMS request.\n- `service`: The service associated\
        \ with the SMS request.\n- `status`: The status of the SMS request.\n- `pool`:\
        \ The pool associated with the SMS request.\n- `timestamp`: The timestamp\
        \ of the SMS request.\n- `completed_on`: The completion date of the SMS request.\n\
        - `expiry`: The expiry time of the SMS request.\n- `time_left`: The time left\
        \ for the SMS request to expire.\n    \n\nPlease note that the values for\
        \ the properties are not provided in the response example, so they may be\
        \ empty or null.\n\nThe last execution of this API request returned a response\
        \ with a status code of 200, indicating a successful execution. The response\
        \ body contained an array of SMS request history objects.\n\nPlease refer\
        \ to the API documentation for more details on how to use this endpoint and\
        \ interpret the response."
      operationId: request_history
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/request_history_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              examples:
                "200":
                  summary: "200"
                  value:
                  - cost: "0.42"
                    order_code: ABCDEFGH
                    phonenumber: "1234567890"
                    code: "0"
                    full_code: ""
                    short_name: US
                    service: Service
                    status: pending
                    pool: 7
                    timestamp: 2024-01-06 17:37:49
                    completed_on: 2024-01-06 17:37:49
                    expiry: 1704560269
                    time_left: 868
              schema: {}
          description: OK
        "401":
          content:
            application/json:
              example:
                success: 0
                errors:
                - message: Invalid API key
                  param: key
              schema: {}
          description: Malformed API key
        "403":
          content:
            application/json:
              examples:
                "403":
                  summary: "403"
                  value:
                    success: 0
                    errors:
                    - message: Invalid API key
                      param: key
                      description: Your API key which can be found on your settings
                        page at /my/settings
              schema: {}
          description: Error
      security:
      - bearerAuth: []
      summary: Order History
