components:
  schemas:
    request_pricing_request:
      properties:
        country:
          description: Optional parameter to request services per country
          example: "1"
          type: string
        service:
          description: Service name or service ID which can be retrieved at the /service/retrieve_all
            endpoint
          example: "1"
          type: string
        pool:
          example: "1"
          type: string
        max_price:
          example: 0.05
          type: number
      type: object
    rental_refund_request:
      properties:
        rental_code:
          description: The retrieved rental code from the `Order rental` endpoint.
          example: ABCDEFGH
          type: string
      required:
      - rental_code
      type: object
    sms_cancel_request:
      properties:
        orderid:
          example: 16GJCFZA
          type: string
        orderids:
          type: string
        expiry:
          type: integer
        ban:
          type: integer
      type: object
    esim_label_update_request:
      properties:
        transactionId:
          description: transactionId retrieved from /esim/purchase
          example: ABCDEFGHI123456
          type: string
        label:
          description: "The new label: letters, numbers and spaces, at most 30 characters.\
            \ Empty or left out removes the label."
          example: Travel phone
          type: string
      required:
      - transactionId
      type: object
    rental_retrieve_all_request:
      properties:
        type:
          description: Choose whether the rental is extendable or not with a 0 or
            1
          example: 1
          type: integer
